services:
  - type: web
    name: los-santos-ems-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: los-santos-ems-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: EMS_CHIEF_ROLE_IDS
        sync: false
      - key: EMS_DEPUTY_ROLE_IDS
        sync: false
      - key: EMS_REQUEST_CHANNEL_ID
        sync: false

databases:
  - name: los-santos-ems-db
    plan: basic-256mb
